<!DOCTYPE html>
<html lang="my" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADANAR Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Padauk', sans-serif; } </style>
</head>
<body class="h-full text-slate-100 flex flex-col">

    <!-- Password Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm text-center space-y-4 shadow-2xl">
            <h2 class="text-lg font-bold text-white">အက်ဒမင် လုံခြုံရေး စစ်ဆေးခြင်း</h2>
            <input type="password" id="adminPasswordInput" inputmode="numeric" placeholder="ဖုန်းနံပါတ် ထည့်ပါ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-amber-400 font-bold focus:outline-none">
            <button onclick="verifyAdminPassword()" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl">🔓 ဝင်မည်</button>
            <p id="authErrorMsg" class="text-xs text-red-400 font-bold" style="display: none;">❌ နံပါတ် မှားယွင်းနေပါသည်။</p>
        </div>
    </div>

    <header class="bg-slate-800 border-b border-slate-700 px-5 py-4 flex justify-between items-center sticky top-0 z-30">
        <h1 class="text-lg font-bold text-amber-400">YADANAR Admin</h1>
        <button onclick="refreshAll()" class="bg-slate-700 text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-rotate"></i> ပြန်စစ်မည်</button>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-5 flex-grow w-full space-y-5">
        <div class="flex border-b border-slate-700 space-x-6 overflow-x-auto">
            <button onclick="switchTab('orders')" id="tab-orders" class="pb-2.5 border-b-2 border-amber-500 font-bold text-amber-500 text-sm">အော်ဒါစာရင်းများ</button>
            <button onclick="switchTab('approvals')" id="tab-approvals" class="pb-2.5 border-b-2 border-transparent text-slate-400 text-sm">အကောင့်အတည်ပြုရန် (<span id="pendingCount">0</span>)</button>
            <button onclick="switchTab('menuManager')" id="tab-menuManager" class="pb-2.5 border-b-2 border-transparent text-slate-400 text-sm">မီနူး စီမံရန်</button>
            <button onclick="switchTab('announcement')" id="tab-announcement" class="pb-2.5 border-b-2 border-transparent text-slate-400 text-sm">ကြော်ငြာစာတမ်း</button>
        </div>

        <!-- Orders Section -->
        <section id="section-orders" class="space-y-3">
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900/80 text-slate-400 uppercase font-bold">
                        <tr><th class="p-3">နေ့စွဲ</th><th class="p-3">အော်ဒါ ID</th><th class="p-3">ကဒ်</th><th class="p-3">အခန်း</th><th class="p-3">ဟင်းပွဲများ</th><th class="p-3">စုစုပေါင်း</th><th class="p-3">အခြေအနေ</th></tr>
                    </thead>
                    <tbody id="ordersTable" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </section>

        <!-- Approvals Section -->
        <section id="section-approvals" class="space-y-3 hidden">
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900/80 text-slate-400 uppercase font-bold">
                        <tr><th class="p-3">ကဒ်နံပါတ်</th><th class="p-3">အဆောင်</th><th class="p-3">အခန်း</th><th class="p-3 text-center">လုပ်ဆောင်ချက်</th></tr>
                    </thead>
                    <tbody id="approvalsTable" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </section>

        <!-- Menu Manager Section -->
        <section id="section-menuManager" class="space-y-3 hidden">
            <div class="flex justify-between items-center">
                <button onclick="addNewMenuRow()" class="bg-green-600 text-white text-xs px-3 py-2 rounded-lg">+ မီနူးအသစ်</button>
                <button onclick="saveMenuToSheet()" class="bg-amber-500 text-slate-900 text-xs px-4 py-2 rounded-lg font-bold">သိမ်းဆည်းမည်</button>
            </div>
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto p-3">
                <table class="w-full text-left text-xs text-slate-300">
                    <tbody id="menuManageTable" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </section>

        <!-- Announcement Section -->
        <section id="section-announcement" class="space-y-4 hidden">
            <textarea id="announcementInput" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-sm text-white" placeholder="ကြော်ငြာစာသား..."></textarea>
            <button onclick="saveAnnouncementText()" class="bg-amber-500 text-slate-900 font-bold px-5 py-2 rounded-lg text-xs">ကြော်ငြာစာတမ်း သိမ်းဆည်းမည်</button>
        </section>
    </main>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyyWEPCNWP7crdfRJdm2yCWrCzuctsqAV_uUoDWJJrhPiN7CDFre9IyRSkB4uFPC-ie/exec"; // သင့် GAS Web App URL ထည့်ရန်
        const CORRECT_ADMIN_PWD = "0947301953";

        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("yadanar_admin_auth") === "true") {
                refreshAll();
            } else {
                document.getElementById("authModal").style.display = "flex";
            }
        });

        function verifyAdminPassword() {
            if (document.getElementById("adminPasswordInput").value.trim() === CORRECT_ADMIN_PWD) {
                localStorage.setItem("yadanar_admin_auth", "true");
                document.getElementById("authModal").style.display = "none";
                refreshAll();
            } else {
                document.getElementById("authErrorMsg").style.display = "block";
            }
        }

        async function callBackend(payload) {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        async function refreshAll() {
            const res = await callBackend({ action: "getAdminData" });
            if (res.status === "success") {
                renderOrders(res.orders);
                renderApprovals(res.pendingUsers);
                renderMenuManager(res.menus);
                document.getElementById("announcementInput").value = res.announcement || "";
            }
        }

        function switchTab(tab) {
            ['orders', 'approvals', 'menuManager', 'announcement'].forEach(t => {
                document.getElementById(`section-${t}`).classList.toggle("hidden", t !== tab);
                document.getElementById(`tab-${t}`).className = t === tab ? "pb-2.5 border-b-2 border-amber-500 font-bold text-amber-500 text-sm" : "pb-2.5 border-b-2 border-transparent text-slate-400 text-sm";
            });
        }

        function renderOrders(orders) {
            const tbody = document.getElementById("ordersTable");
            tbody.innerHTML = (orders || []).map(o => `
                <tr>
                    <td class="p-3">${o.date}</td>
                    <td class="p-3">${o.orderId}</td>
                    <td class="p-3">${o.customer}</td>
                    <td class="p-3">${o.room}</td>
                    <td class="p-3">${o.items}</td>
                    <td class="p-3">${o.total} THB</td>
                    <td class="p-3">
                        <select onchange="updateOrderStatus(${o.rowIndex}, this.value)" class="bg-slate-700 p-1 rounded text-xs">
                            <option value="မှာယူထားသည်" ${o.deliveryStatus==='မှာယူထားသည်'?'selected':''}>မှာယူထားသည်</option>
                            <option value="ပို့ဆောင်နေသည်" ${o.deliveryStatus==='ပို့ဆောင်နေသည်'?'selected':''}>ပို့ဆောင်နေသည်</option>
                            <option value="ပို့ဆောင်ပြီး" ${o.deliveryStatus==='ပို့ဆောင်ပြီး'?'selected':''}>ပို့ဆောင်ပြီး</option>
                            <option value="ကုန်သွားပြီး" ${o.deliveryStatus==='ကုန်သွားပြီး'?'selected':''}>ကုန်သွားပြီး</option>
                        </select>
                    </td>
                </tr>
            `).join('') || `<tr><td colspan="7" class="p-4 text-center">အော်ဒါ မရှိပါ။</td></tr>`;
        }

        async function updateOrderStatus(rowIndex, status) {
            await callBackend({ action: "updateOrderStatus", rowIndex, field: "deliveryStatus", value: status });
            refreshAll();
        }

        function renderApprovals(users) {
            document.getElementById("pendingCount").innerText = users ? users.length : 0;
            document.getElementById("approvalsTable").innerHTML = (users || []).map(u => `
                <tr>
                    <td class="p-3">${u.custCode}</td>
                    <td class="p-3">${u.building}</td>
                    <td class="p-3">${u.roomNo}</td>
                    <td class="p-3 text-center">
                        <button onclick="updateUserStatus('${u.custCode}', 'approved')" class="bg-green-600 px-3 py-1 rounded text-white font-bold">ခွင့်ပြုမည်</button>
                    </td>
                </tr>
            `).join('') || `<tr><td colspan="4" class="p-4 text-center">စောင့်ဆိုင်းနေသူ မရှိပါ။</td></tr>`;
        }

        async function updateUserStatus(custCode, status) {
            await callBackend({ action: "updateUserApproval", custCode, approvalStatus: status });
            refreshAll();
        }

        function renderMenuManager(menus) {
            document.getElementById("menuManageTable").innerHTML = (menus || []).map(m => `
                <tr class="menu-row">
                    <td class="p-2"><input type="checkbox" class="menu-status" ${m.status?'checked':''}> ရရှိ</td>
                    <td class="p-2"><input type="text" value="${m.code}" class="menu-code bg-slate-700 p-1 rounded w-16"></td>
                    <td class="p-2"><input type="text" value="${m.name}" class="menu-name bg-slate-700 p-1 rounded w-32"></td>
                    <td class="p-2"><input type="number" value="${m.price}" class="menu-price bg-slate-700 p-1 rounded w-16"></td>
                    <td class="p-2"><input type="text" value="${m.image||''}" class="menu-image bg-slate-700 p-1 rounded w-48" placeholder="Image URL"></td>
                </tr>
            `).join('');
        }

        function addNewMenuRow() {
            const tbody = document.getElementById("menuManageTable");
            const row = document.createElement("tr");
            row.className = "menu-row";
            row.innerHTML = `
                <td class="p-2"><input type="checkbox" class="menu-status" checked> ရရှိ</td>
                <td class="p-2"><input type="text" placeholder="ကုဒ်" class="menu-code bg-slate-700 p-1 rounded w-16"></td>
                <td class="p-2"><input type="text" placeholder="ဟင်းမည်" class="menu-name bg-slate-700 p-1 rounded w-32"></td>
                <td class="p-2"><input type="number" placeholder="ဈေး" class="menu-price bg-slate-700 p-1 rounded w-16"></td>
                <td class="p-2"><input type="text" placeholder="Image URL" class="menu-image bg-slate-700 p-1 rounded w-48"></td>
            `;
            tbody.appendChild(row);
        }

        async function saveMenuToSheet() {
            const rows = document.querySelectorAll(".menu-row");
            const menus = Array.from(rows).map(r => ({
                status: r.querySelector(".menu-status").checked,
                code: r.querySelector(".menu-code").value.trim(),
                name: r.querySelector(".menu-name").value.trim(),
                price: Number(r.querySelector(".menu-price").value) || 0,
                image: r.querySelector(".menu-image").value.trim()
            }));
            const res = await callBackend({ action: "saveMenus", menus });
            if (res.status === "success") alert("✅ မီနူးများ သိမ်းဆည်းပြီးပါပြီ။");
        }

        async function saveAnnouncementText() {
            const text = document.getElementById("announcementInput").value.trim();
            await callBackend({ action: "saveAnnouncement", announcement: text });
            alert("✅ ကြော်ငြာစာတမ်း သိမ်းဆည်းပြီးပါပြီ။");
        }
    </script>
</body>
</html>
